name: Build and upload RPM sources
on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]
permissions: write-all
jobs:
  rpm-source:
    runs-on: ubuntu-latest
    steps:
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y git rpm devscripts debhelper curl
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build source files
        run: |
          set -euo pipefail
          v="$(awk '$1 == "Version:" {print $2; exit}' packaging/rpm/lingmo-sdk.spec)"
          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS rpm-obs-source
          git archive --format=tar.gz --prefix="lingmo-sdk-${v}/" "$GITHUB_SHA" > "rpmbuild/SOURCES/lingmo-sdk-${v}.tar.gz"
          cp packaging/rpm/lingmo-sdk.spec rpmbuild/SPECS/
          # OBS resolves BuildRequires. GitHub's Ubuntu runner does not carry
          # the target RPM development packages, so only create the SRPM here.
          rpmbuild -bs --nodeps --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/lingmo-sdk.spec
          dpkg-buildpackage -S -us -uc -d
          cp "rpmbuild/SOURCES/lingmo-sdk-${v}.tar.gz" packaging/rpm/lingmo-sdk.spec rpm-obs-source/
          cp ../lingmo-sdk_*.dsc ../lingmo-sdk_*.tar.* rpm-obs-source/
      - name: Upload sources to OBS
        if: github.event_name != 'pull_request'
        uses: LingmoOS/action-upload-to-obs@0.0.4
        with:
          remove-old-sources: true
          obs-package-name: lingmo-sdk
          obs-project-name: home:LingmoOS
          obs-user-name: ${{ secrets.OBS_USERNAME }}
          obs-password: ${{ secrets.OBS_TOKEN }}
          obs-instance-url: https://api.opensuse.org
          local-package-dir: ./rpm-obs-source
      - name: Upload RPM spec to OBS
        if: github.event_name != 'pull_request'
        env: { OBS_USERNAME: ${{ secrets.OBS_USERNAME }}, OBS_TOKEN: ${{ secrets.OBS_TOKEN }} }
        run: curl --fail --user "$OBS_USERNAME:$OBS_TOKEN" --upload-file packaging/rpm/lingmo-sdk.spec 'https://api.opensuse.org/source/home:LingmoOS/lingmo-sdk/lingmo-sdk.spec?cmd=commit&meta=0&keeplink=0&comment=Upload%20RPM%20spec'
