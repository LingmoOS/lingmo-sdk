name: Build RPM source package

permissions: write-all

on:
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ main ]

jobs:
  rpm-source:
    name: RPM source package
    runs-on: ubuntu-latest
    steps:
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y git rpm devscripts debhelper curl python3

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source tarball and SRPM
        shell: bash
        run: |
          set -euo pipefail
          rpm_version="$(awk '$1 == "Version:" { print $2; exit }' packaging/rpm/lingmo-sdk.spec)"
          test -n "$rpm_version"
          top="$PWD/rpmbuild"
          mkdir -p "$top/SOURCES" "$top/SPECS" "$top/SRPMS"
          source_root="$PWD/rpm-source-tree/lingmo-sdk-${rpm_version}"
          mkdir -p "$source_root"
          git archive "${GITHUB_SHA}" | tar -x -C "$source_root"
          # Skia is intentionally not tracked in Git. Include the pinned
          # source tree in the SRPM so OBS builds never need network access.
          bash "$source_root/scripts/fetch-skia.sh"
          sed -i '\|^/third_party/skia/|d' "$source_root/.gitignore"
          rm -rf "$source_root/third_party/skia/.git"
          tar -czf "$top/SOURCES/lingmo-sdk-${rpm_version}.tar.gz" \
            -C "$PWD/rpm-source-tree" "lingmo-sdk-${rpm_version}"
          cp packaging/rpm/lingmo-sdk.spec "$top/SPECS/"
          rpmbuild -bs --nodeps --define "_topdir $top" "$top/SPECS/lingmo-sdk.spec"
          (cd "$source_root" && dpkg-buildpackage -S -us -uc -d)
          mkdir -p rpm-source-output rpm-obs-source
          cp "$top/SOURCES/lingmo-sdk-${rpm_version}.tar.gz" rpm-source-output/
          cp "$top/SPECS/lingmo-sdk.spec" rpm-source-output/
          cp "$top/SRPMS/"*.src.rpm rpm-source-output/
          cp "$top/SOURCES/lingmo-sdk-${rpm_version}.tar.gz" rpm-obs-source/
          cp "$top/SPECS/lingmo-sdk.spec" rpm-obs-source/
          cp "$source_root"/../lingmo-sdk_*.dsc "$source_root"/../lingmo-sdk_*.tar.* rpm-obs-source/
          cp "$source_root"/../lingmo-sdk_*.dsc "$source_root"/../lingmo-sdk_*.tar.* rpm-source-output/

      - name: Upload RPM source package
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-sdk-rpm-source
          path: rpm-source-output/
          if-no-files-found: error

      - name: Upload RPM sources to OBS
        if: github.event_name != 'pull_request'
        uses: LingmoOS/action-upload-to-obs@0.0.4
        with:
          remove-old-sources: true
          obs-package-name: 'lingmo-sdk'
          obs-project-name: 'home:LingmoOS'
          obs-user-name: ${{ secrets.OBS_USERNAME }}
          obs-password: ${{ secrets.OBS_TOKEN }}
          obs-instance-url: 'https://api.opensuse.org'
          local-package-dir: './rpm-obs-source'

      - name: Upload RPM spec to OBS
        if: github.event_name != 'pull_request'
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --user "$OBS_USERNAME:$OBS_TOKEN" \
            --upload-file packaging/rpm/lingmo-sdk.spec \
            'https://api.opensuse.org/source/home:LingmoOS/lingmo-sdk/lingmo-sdk.spec?cmd=commit&meta=0&keeplink=0&comment=Upload%20RPM%20spec'
